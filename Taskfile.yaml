version: "3"


tasks:
  up:
    desc: Bootstrap the whole lab (bao, kind, kustomize apply, HCP workspace, terraform apply)
    cmds:
      - task: bao:up
      - task: cluster:up
      - task: k8s:apply
      - task: tf:workspace
      - task: tf:apply

  down:
    desc: Tear down the kind cluster (OpenBao container is left running)
    cmds:
      - ./scripts/cluster-down.sh

  bao:up:
    desc: Create/start OpenBao (+ auto-unseal sidecar), init on first run
    cmds:
      - ./scripts/bao-up.sh

  bao:down:
    desc: Remove OpenBao containers (keeps data)
    cmds:
      - ./scripts/bao-down.sh

  bao:purge:
    desc: DELETE OpenBao data, keys and certs
    cmds:
      - ./scripts/bao-purge.sh

  cluster:up:
    desc: Create the kind cluster and attach bao to the kind network
    cmds:
      - ./scripts/cluster-up.sh

  # Order matters: bao before the cluster (network attach), the cluster objects before terraform (it reads the
  # reviewer token/CA from them to configure OpenBao). Terraform state is in HCP.
  tf:workspace:
    desc: Create the HCP Terraform workspace (local execution) if missing
    cmds:
      - ./scripts/tfc-workspace-up.sh

  k8s:apply:
    desc: Apply all Kubernetes manifests with Kustomize (kubectl apply -k k8s)
    cmds:
      - ./scripts/k8s-up.sh

  k8s:diff:
    desc: Show what `kubectl apply -k k8s` would change
    cmds:
      - kubectl --context kind-vault-lab diff -k k8s || true

  # Terraform manages OpenBao only; always run it through scripts/tf.sh (injects VAULT_TOKEN and cluster values).
  tf:init:
    cmds:
      - ./scripts/tf.sh init

  tf:plan:
    deps: [tf:init]
    cmds:
      - ./scripts/tf.sh plan

  tf:apply:
    deps: [tf:init]
    desc: Apply the OpenBao configuration (auth mounts, policies, data, DB engine)
    cmds:
      - ./scripts/tf.sh apply -auto-approve

  smoke:
    desc: Policy test matrix - pods in several namespaces/SAs/pod names probe allowed and denied paths
    cmds:
      - ./scripts/smoke-test.sh

  audit:
    desc: Tail the OpenBao audit log, one coloured line per request (raw JSON is in the bao container)
    cmds:
      - docker exec bao tail -n 200 -f /openbao/file/audit.log | jq --unbuffered -rR -f scripts/audit-pretty.jq

  auditraw:
    desc: Tail the OpenBao audit log
    cmds:
      - docker exec bao tail -n 200 -f /openbao/file/audit.log
