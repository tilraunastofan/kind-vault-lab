version: "3"

# Root token for terraform only; the pods and policies in the lab never use it. Evaluated lazily so
# tasks that run before .secrets/ exists (bao:up) still work (`|| true`).
env:
  VAULT_TOKEN:
    sh: jq -r .root_token .secrets/init.json 2>/dev/null || true

tasks:
  up:
    desc: Bootstrap the whole lab (kind, bao network, HCP workspace, terraform apply)
    cmds:
      - task: bao:up
      - task: cluster:up
      - task: tf:workspace
      - task: tf:apply

  down:
    desc: Tear down the kind cluster (OpenBao container is left running)
    cmds:
      - ./scripts/cluster-down.sh

  bao:up:
    desc: Create/start OpenBao (+ auto-unseal sidecar), init on first run
    cmds:
      - ./scripts/bao-up.sh

  bao:down:
    desc: Remove OpenBao containers (keeps data)
    cmds:
      - ./scripts/bao-down.sh

  bao:purge:
    desc: DELETE OpenBao data, keys and certs
    cmds:
      - ./scripts/bao-purge.sh

  cluster:up:
    desc: Create the kind cluster and attach bao to the kind network
    cmds:
      - ./scripts/cluster-up.sh

  # Order matters: bao must be up before the cluster (network attach) and both before terraform
  # (it configures auth in bao and objects in the cluster). Terraform state is in HCP.
  tf:workspace:
    desc: Create the HCP Terraform workspace (local execution) if missing
    cmds:
      - ./scripts/tfc-workspace-up.sh

  tf:init:
    dir: terraform
    cmds:
      - terraform init

  tf:plan:
    dir: terraform
    deps: [tf:init]
    cmds:
      - terraform plan

  tf:apply:
    dir: terraform
    deps: [tf:init]
    desc: Apply k8s + OpenBao config (VAULT_TOKEN is read from .secrets/init.json)
    cmds:
      - terraform apply -auto-approve

  smoke:
    desc: Policy test matrix - pods in several namespaces/SAs/pod names probe allowed and denied paths
    cmds:
      - ./scripts/smoke-test.sh

  audit:
    desc: Tail the OpenBao audit log, one coloured line per request (raw JSON is in the bao container)
    cmds:
      - docker exec bao tail -n 200 -f /openbao/file/audit.log | jq --unbuffered -rR -f scripts/audit-pretty.jq

  auditraw:
    desc: Tail the OpenBao audit log
    cmds:
      - docker exec bao tail -n 200 -f /openbao/file/audit.log
