# CA that pods use to trust OpenBao at https://bao:8200. The CA is generated per laptop (bao/pki/ is gitignored),
# so scripts/k8s-up.sh copies it to ca.crt here (also gitignored) before applying. Kustomize refuses files outside
# its own directory, which is why it is copied instead of referenced.
generatorOptions:
  disableNameSuffixHash: true   # pods reference the ConfigMap by its plain name "bao-ca"
configMapGenerator:
  - {name: bao-ca, namespace: team-a, files: [ca.crt]}
  - {name: bao-ca, namespace: team-b, files: [ca.crt]}
  - {name: bao-ca, namespace: team-c, files: [ca.crt]}
