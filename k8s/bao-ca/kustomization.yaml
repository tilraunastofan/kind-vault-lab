# Cluster-wide trust for OpenBao's TLS certificate: ONE ClusterTrustBundle instead of a ConfigMap per namespace.
# Pods opt in with a `clusterTrustBundle` projected volume (see scripts/smoke-test.sh); kubelet keeps the file updated.
# The manifest is generated per laptop by scripts/k8s-up.sh (the CA is generated locally and gitignored) and the
# file lands here as clustertrustbundle.yaml (also gitignored).
resources:
  - clustertrustbundle.yaml
