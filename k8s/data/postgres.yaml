# Mock "orders" database that OpenBao's database engine creates dynamic users in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-root, key: POSTGRES_PASSWORD}}
            - {name: POSTGRES_DB, value: orders}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 5
            periodSeconds: 3
          resources:
            limits: {memory: 256Mi}
            requests: {memory: 128Mi, cpu: 50m}
---
# NodePort because bao is outside the cluster and ClusterIPs aren't routable from the docker network;
# OpenBao connects to vault-lab-worker:30432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  type: NodePort
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
