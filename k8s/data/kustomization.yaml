resources:
  - postgres.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # pg-root.env (POSTGRES_PASSWORD=...) is generated once by scripts/k8s-up.sh and is gitignored; terraform reads the
  # same value so OpenBao can connect as the database root user.
  - name: postgres-root
    namespace: data
    envs: [pg-root.env]
